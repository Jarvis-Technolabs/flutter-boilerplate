name: flutter_clean_architecture
version: 3.22.3+6
description: Boilerplate Flutter project.

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  auto_size_text: 3.0.0
  avatar_view: 1.0.1
  cached_network_image: ^3.4.1
  chucker_flutter: ^1.9.2
  connectivity_plus: ^7.2.0
  dartz: 0.10.1
  device_info_plus: ^12.1.0
  device_preview: ^1.3.1
  dio: ^5.10.0
  dio_cache_interceptor: ^3.5.1
  dio_cache_interceptor_hive_store: ^4.0.0
  drift: ^2.19.1+1
  encrypt: ^5.0.3
  encrypted_drift:
    git:
      url: https://github.com/simolus3/drift.git
      path: extras/encryption
  equatable: ^2.0.8
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  firebase_analytics: ^12.4.3
  firebase_crashlytics: ^5.2.4
  firebase_messaging: ^16.4.1
  flutter_custom_utility: ^1.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_jailbreak_detection_plus: ^1.10.7
  flutter_localization: ^0.4.0
  flutter_local_notifications: ^21.0.0
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  hive: 2.2.3
  hive_flutter: 1.1.0
  hive_generator: ^2.0.1
  image_and_file_picker_utility: ^0.0.11
  internet_connection_checker_plus: ^3.1.0
  jt_flutter_cli: ^1.3.1
  keyboard_actions: ^4.2.1
  logger: ^2.7.0
  logging: 1.3.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  pin_code_fields: ^9.4.0
  intl: ^0.20.2
  share_plus: ^12.0.1
  shared_preferences: ^2.5.5
  shimmer: 3.0.0
  sign_in_with_apple: ^8.1.0
  store_redirect: ^2.0.4
  super_tooltip: ^2.1.1
  webview_flutter: ^4.14.0

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.19.1
  flutter_gen_runner: ^5.8.0
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  pubspec_dependency_sorter: ^1.0.5

#  Replace ic_launcher.png file according to project at "assets/images/launcher/ic_launcher.png" path
#  Execute "flutter clean" command in terminal
#  Execute "flutter pub get" command in terminal
#  Execute "flutter pub run flutter_launcher_icons" command in terminal

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/launcher/ic_launcher.png"

flutter:
  uses-material-design: true

  assets:
    - lang/
    - assets/images/icons/
    - assets/images/splash/
    - assets/images/app_logo/
    - assets/mock_json/

  fonts:
    - family: Mulish
      fonts:
        - asset: assets/fonts/MulishBold.ttf
          weight: 700
        - asset: assets/fonts/MulishSemiBold.ttf
          weight: 600
        - asset: assets/fonts/MulishMedium.ttf
          weight: 500
