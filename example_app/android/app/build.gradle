import java.util.regex.Matcher
import java.util.regex.Pattern

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def getCurrentFlavor() {
    Gradle gradle = getGradle()
    String tskReqStr = gradle.getStartParameter().getTaskRequests().toString()

    Pattern pattern

    if (tskReqStr.contains("assemble"))
        pattern = Pattern.compile("assemble(\\w+)(Release|Debug|Profile)")
    else if (tskReqStr.contains("bundle"))
        pattern = Pattern.compile("bundle(\\w+)(Release|Debug|Profile)")
    else
        pattern = Pattern.compile("generate(\\w+)(Release|Debug|Profile)")

    Matcher matcher = pattern.matcher(tskReqStr)

    if (matcher.find())
        return matcher.group(1).toLowerCase()
    else {
        println "NO MATCH FOUND"
        return ""
    }
}

def keystoreProperties = new Properties()

android {
    compileSdkVersion 36
    ndkVersion "28.2.13676358"
    namespace 'com.jarvistechnolabs.exampleapp'
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    compileOptions {
        // Enable core library desugaring (required for flutter_local_notifications)
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        stagingConfig {
            def keystorePropertiesFile = rootProject.file("keystore.staging.properties")
            keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }

        releaseConfig {
            def keystorePropertiesFile = rootProject.file("keystore.production.properties")
            keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId "com.jarvistechnolabs.exampleapp"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    flavorDimensions "app"

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            if (getCurrentFlavor() == 'dev' || getCurrentFlavor() == 'staging') {
                println "stagingConfig getting assigned"
                signingConfig signingConfigs.stagingConfig
            } else {
                println "releaseConfig getting assigned"
                signingConfig signingConfigs.releaseConfig
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    productFlavors {
        dev {
            dimension "app"
            applicationIdSuffix ".dev"
            manifestPlaceholders = [
                    appName: "Dev ExampleApp",
                    mapsKey: "AIzaSyD6DCpz7gh1QexinwRdqCc6hNfMQM1kU90"
            ]
        }
        staging {
            dimension "app"
            applicationIdSuffix ".staging"
            manifestPlaceholders = [
                    appName: "Staging ExampleApp",
                    mapsKey: "AIzaSyD6DCpz7gh1QexinwRdqCc6hNfMQM1kU90"
            ]
        }
        prod {
            applicationId "com.jarvistechnolabs.exampleapp"
            dimension "app"
            manifestPlaceholders = [
                    appName: "ExampleApp",
                    mapsKey: "AIzaSyD6DCpz7gh1QexinwRdqCc6hNfMQM1kU90"
            ]
        }
    }
}

flutter {
    source '../..'
}

dependencies {
// implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "com.jakewharton.timber:timber:4.6.1"
    implementation platform("com.google.firebase:firebase-bom:32.1.1")
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
}
