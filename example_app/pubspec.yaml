name: example_app
version: 1.0.0+1
description: Example app flutter project.

environment: 
  sdk: ">=3.4.0 <4.0.0"


dependencies:
  another_flushbar: 1.12.30
  auto_size_text: 3.0.0
  avatar_view: 1.0.1
  animated_text_kit: ^4.2.2
  cached_network_image: ^3.4.1
  chucker_flutter: ^1.9.2
  connectivity_plus: ^7.2.0
  country_picker: ^2.0.20
  dartz: 0.10.1
  device_info_plus: ^12.1.0
  device_preview: ^1.3.1
  dio: ^5.10.0
  dio_cache_interceptor: ^3.5.1
  dio_cache_interceptor_hive_store: ^4.0.0
  drift: ^2.19.1+1
  encrypt: ^5.0.3
  equatable: ^2.0.8
  encrypted_drift:
    git:
      url: https://github.com/simolus3/drift.git
      path: extras/encryption
  flutter:
    sdk: flutter
  flutter_custom_utility: ^1.1.0
  firebase_analytics: ^12.1.0
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  firebase_messaging: ^16.4.1
  flutter_bloc: ^9.0.0
  flutter_downloader: ^1.11.6
  flutter_jailbreak_detection_plus: ^1.10.7
  flutter_local_notifications: ^17.2.1+2
  flutter_localization: ^0.3.3
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.3.0
  geolocator: ^11.0.0
  get_it: ^9.2.1
  google_maps_flutter: ^2.5.3
  google_sign_in: ^6.2.1
  hive: 2.2.3
  hive_flutter: 1.1.0
  hive_generator: ^2.0.1
  image_and_file_picker_utility: ^0.0.11
  internet_connection_checker_plus: ^3.0.1
  intl_phone_field: 3.2.0
  jt_flutter_cli: ^1.3.1
  keyboard_actions: ^4.2.1
  loading_indicator: 3.1.1
  logger: ^2.7.0
  logging: 1.3.0
  lottie: ^3.3.1
  local_auth: ^2.2.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  persistent_bottom_nav_bar: ^6.2.1
  pinput: ^4.0.0
  share_plus: ^12.0.1
  shared_preferences: ^2.5.5
  shimmer: 3.0.0
  sign_in_with_apple: ^7.0.1
  signalr_netcore: ^1.3.7
  store_redirect: ^2.0.4
  super_tooltip: ^2.0.9
  webview_flutter: ^4.14.0
  privacy_screen: ^0.0.8
  smooth_page_indicator: ^1.1.0
  vibration: ^3.1.5



dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.19.1
  flutter_gen_runner: ^5.8.0
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  pubspec_dependency_sorter: ^1.0.5



#  Replace ic_launcher.png file according to project at "assets/images/launcher/ic_launcher.png" path
#  Execute "flutter clean" command in terminal
#  Execute "flutter pub get" command in terminal
#  Execute "flutter pub run flutter_launcher_icons" command in terminal

flutter_launcher_icons: 
  android: launcher_icon
  image_path: assets/images/launcher/ic_launcher.png
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets: 
    - lang/
    - assets/images/icons/
    - assets/images/splash/
    - assets/images/app_logo/
    - assets/images/lottie_animation/
    - assets/mock_json/
    - assets/images/intro_img/
    - assets/animation/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterBold.otf
          weight: 700
        - asset: assets/fonts/InterSemiBold.otf
          weight: 600
        - asset: assets/fonts/InterMedium.otf
          weight: 500
        - asset: assets/fonts/InterRegular.otf
          weight: 400
